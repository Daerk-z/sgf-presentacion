      <section class="section" aria-labelledby="titulo-capturas">
        <h1 id="titulo-capturas">Capturas</h1>
        <p class="lead">Algunas pantallas del sistema. Todas las capturas usan datos de prueba.</p>
      </section>

      <section class="section gallery" aria-label="Galería de capturas">
        <figure>
          <img src="img/capturas/captura-1.png" width="1280" height="800" loading="lazy"

        </figure>

        </figure>

        </figure>
        <figure>
          <img src="img/capturas/captura-4.png" width="1280" height="800" loading="lazy"
               alt="Pantalla de inventario de SGF con la lista de lotes y alertas de vencimiento resaltadas">
